<!DOCTYPE html>
<html lang="pt-BR">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorganaFlix - Portal Místico</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/273g29F4/Logo-Morgana-Flix-Fada.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

    <div class="snow-container"></div>

    <div class="background"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <img src="https://i.ibb.co/pjrLNdXK/Logo-Morgana-Flix-Branco.png" alt="Logo MorganaFlix">
            </div>
        </header>
        
        <main>
            <div class="login-box">
                <div class="decor-top">
                    <span class="material-symbols-outlined">eco</span>
                </div>
                <div class="decor-bottom">
                    <span class="material-symbols-outlined">eco</span>
                </div>
                <div class="icon-circle">
                    <span class="material-symbols-outlined">fluid</span>
                </div>
                
                <h1>Bem-vinda</h1>
                <p>Entre na Terra Do Nunca</p>
                <form onsubmit="verificarSenha(); return false;">
                    <label>
                        <span class="label-title">
                            <span class="material-symbols-outlined">auto_fix_high</span>Senha-Mágica
                        </span>
                    </label>
                    <div class="input-box">
                        <input type="password" id="senha" placeholder="Sua senha secreta">
                        <button type="button" onclick="mostrarSenha()">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                    
                    <p id="mensagemErro" class="erro"></p>

                    <button type="button" class="btn-login" onclick="verificarSenha()">
                        <span class="material-symbols-outlined">magic_button</span>DESBLOQUEAR PORTAL
                    </button>
                </form>
            </div>
        </main>
        
        <footer>
            <p>© 2026 MorganaFlix - Todos os direitos reservados à Terra do Nunca</p>
        </footer>
    </div>

    <script src="senha.js"></script>

</body>
</html>
